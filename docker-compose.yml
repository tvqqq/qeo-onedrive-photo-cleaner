services:
  web:
    build: .
    command: ["npm", "run", "start"]
    env_file:
      - .env.local
    environment:
      DATA_DIR: /data
      HOSTNAME: 0.0.0.0
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - qeo-photo-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12

  worker:
    build: .
    command: ["npm", "run", "worker"]
    env_file:
      - .env.local
    environment:
      DATA_DIR: /data
    volumes:
      - qeo-photo-data:/data
    depends_on:
      web:
        condition: service_healthy

volumes:
  qeo-photo-data:
