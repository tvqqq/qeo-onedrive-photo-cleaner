name: CI

on:
  push:
    branches: [main, qeo-v0-1]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Tests
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        if: github.event_name == 'pull_request' || contains(github.event.head_commit.message, '[full]')
        run: npm run build
        env:
          DEMO_MODE: "1"
      - name: Docker build
        if: github.event_name == 'pull_request' || contains(github.event.head_commit.message, '[full]')
        run: docker build -t qeo-onedrive-photo-cleaner:ci .
